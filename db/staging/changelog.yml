---
databaseChangeLog:
  - changeSet:
      id: staging-schema
      author: flex
      runOnChange: true
      changes:
        - sql: CREATE SCHEMA IF NOT EXISTS staging AUTHORIZATION flex
        - sql: GRANT USAGE ON SCHEMA staging TO flex_staging_structure_data
        - sql: GRANT USAGE ON SCHEMA staging TO flex_operation_readonly, flex_operation_update, flex_operation_readwrite
  - include:
      file: ./party_staging.sql
      relativeToChangelogFile: true
  - include:
      file: ./energy_supplier_balance_responsibility_staging.sql
      relativeToChangelogFile: true
  - include:
      file: ./metering_grid_area_staging.sql
      relativeToChangelogFile: true
  - include:
      file: ./substation_staging.sql
      relativeToChangelogFile: true
  - changeSet:
      id: staging-operation-roles-grants
      author: flex
      runAlways: true
      changes:
        - sql: GRANT SELECT ON ALL TABLES IN SCHEMA staging TO flex_operation_readonly
        - sql: GRANT SELECT, UPDATE ON ALL TABLES IN SCHEMA staging TO flex_operation_update
        - sql: GRANT SELECT, UPDATE, INSERT, DELETE ON ALL TABLES IN SCHEMA staging TO flex_operation_readwrite
