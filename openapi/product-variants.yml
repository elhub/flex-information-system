---
# Connection between a product type and the product-specific details of a
# service providing group product application.
#
# - `kind` is the `business_id` of the product type. It is the discriminator
#   value inside `application_details` and `assessment_details`.
# - `application` is the component in openapi-api-base.yml describing what the
#   service provider asks for. A product type without an application variant
#   has no application details.
# - `assessment` is the component describing the answer of the procuring system
#   operator. A product type without an assessment variant has no assessment
#   details.
#
# Used by local/scripts/openapi_to_db.py to generate the database validation,
# and checked against the discriminator mappings of the union components.
- kind: manual_frequency_restoration
  application: spgpa_application_details_mfrr
- kind: automatic_frequency_containment
  application: spgpa_application_details_fcr_n
  assessment: spgpa_assessment_details_fcr_n
- kind: automatic_frequency_containment_disturbance
  application: spgpa_application_details_fcr_d
  assessment: spgpa_assessment_details_fcr_d
