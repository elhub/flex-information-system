---
openapi: 3.0.1
info:
  title: Adapter
  description: >-
    API for the adapter service. This service provides data from external
    sources to the Flexibility Information System.

    The adapter is responsible for translating external data formats into the
    format expected by FIS.
  contact:
    name: Elhub AS
    url: https://elhub.no
    email: utvikler@elhub.no
  version: 0.0.1

tags:
  - name: accounting_point
    description: Operations related to accounting points
  - name: grid_areas
    description: Operations related to grid areas
  - name: grid_model
    description: Operations related to the grid model

security:
  - bearer_auth: []

components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: >-
        Bearer token authentication. The token must be included in the
        Authorization header.

  schemas:
    accounting_point_end_user:
      type: object
      required:
        - business_id
        - valid_from
      properties:
        business_id:
          type: string
          description: >
            Business ID of the end user.
            Norwegian organization number or fødselsnummer,
            depending on `entity_type`.
          pattern: "^[1-9][0-9]{8}$|^[0-9]{11}$"
          example: "123456789"
        entity_type:
          type: string
          enum:
            - person
            - organisation
          description: >-
            Type of the end user entity, either a person or an organisation.
          example: "organisation"
        valid_from:
          type: string
          format: date-time
          description: Start of the validity period
          example: "2024-01-01T00:00:00+01:00"
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: End of the validity period
          example: "2024-12-31T00:00:00+01:00"

    accounting_point_energy_supplier:
      type: object
      required:
        - business_id
        - valid_from
      properties:
        business_id:
          type: string
          description: >
            Business ID of the energy supplier.
            GLN format - 13 digits starting with non-zero.
          pattern: "^[1-9][0-9]{12}$"
          example: "7080012345678"
        valid_from:
          type: string
          format: date-time
          description: Start of the validity period
          example: "2024-01-01T00:00:00+01:00"
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: End of the validity period
          example: "2024-12-31T00:00:00+01:00"

    energy_direction:
      type: string
      enum:
        - production
        - consumption

    accounting_point_energy_direction:
      type: object
      required:
        - direction
        - valid_from
      properties:
        direction:
          type: array
          items:
            $ref: '#/components/schemas/energy_direction'
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: Energy direction(s) of the accounting point.
          example: ["consumption"]
        valid_from:
          type: string
          format: date-time
          description: Start of the validity period
          example: "2024-01-01T00:00:00+01:00"
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: End of the validity period
          example: "2024-12-31T00:00:00+01:00"

    accounting_point_metering_grid_area:
      type: object
      required:
        - business_id
        - valid_from
      properties:
        business_id:
          type: string
          description: >
            Business ID of the metering grid area.
            EIC-Y format.
          pattern: "^[0-9]{2}Y[0-9A-Z\\-]{13}$"
          example: "10YNO-1--------2"
        valid_from:
          type: string
          format: date-time
          description: Start of the validity period
          example: "2024-01-01T00:00:00+01:00"
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: End of the validity period
          example: "2024-12-31T00:00:00+01:00"

    accounting_point:
      type: object
      required:
        - gsrn
        - end_user
        - energy_supplier
        - metering_grid_area
      properties:
        gsrn:
          type: string
          description: >-
            Global Service Relation Number (GSRN) - unique identifier for the
            accounting point
          pattern: "^[0-9]{18}$"
          example: "707057500012345678"
        end_user:
          type: array
          description: >-
            Time-dependent list of end users associated with this accounting
            point
          items:
            $ref: '#/components/schemas/accounting_point_end_user'
        energy_supplier:
          type: array
          description: >-
            Time-dependent list of energy suppliers associated with this
            accounting point
          items:
            $ref: '#/components/schemas/accounting_point_energy_supplier'
        metering_grid_area:
          type: array
          description: >-
            Time-dependent list of metering grid areas associated with this
            accounting point
          items:
            $ref: '#/components/schemas/accounting_point_metering_grid_area'
        energy_direction:
          type: array
          description: >-
            Time-dependent list of energy directions associated with this
            accounting point
          items:
            $ref: '#/components/schemas/accounting_point_energy_direction'
        latitude:
          type: number
          description: Geographic latitude of the accounting point (WGS84).
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          example: 59.9139
        longitude:
          description: Geographic longitude of the accounting point (WGS84).
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          example: 10.7522
        substation:
          description: >-
            Substation this accounting point is related to in the grid model.
          type: string
          format: uuid
          example: "67878d70-9e32-47b6-aa29-53fedfab1358"

    metering_grid_area_system_operator:
      type: object
      required:
        - business_id
        - valid_from
      properties:
        business_id:
          type: string
          description: GLN identifier of the system operator
          pattern: "^[0-9]{13}$"
          example: "1234567890123"
        valid_from:
          type: string
          format: date-time
          description: Start of the validity period
          example: "2024-01-01T00:00:00+01:00"
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: End of the validity period
          example: "2024-12-31T00:00:00+01:00"

    price_area:
      type: string
      description: Norwegian price area
      enum:
        - NO1
        - NO2
        - NO3
        - NO4
        - NO5

    metering_grid_area_price_area:
      type: object
      required:
        - price_area
        - valid_from
      properties:
        price_area:
          $ref: '#/components/schemas/price_area'
        valid_from:
          type: string
          format: date-time
          description: Start of the validity period
          example: "2024-01-01T00:00:00+01:00"
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: End of the validity period
          example: "2024-12-31T00:00:00+01:00"

    metering_grid_area:
      type: object
      required:
        - business_id
        - name
        - is_active
        - system_operator
        - price_area
      properties:
        business_id:
          type: string
          description: >
            Business ID of the metering grid area.
            EIC-Y format.
          pattern: "^[0-9]{2}Y[0-9A-Z\\-]{13}$"
          example: "10YNO-1--------2"
        name:
          type: string
          description: Name of the metering grid area
          example: "X AREA 2"
        is_active:
          type: boolean
          description: Whether the MGA is active
          example: true
        system_operator:
          type: array
          items:
            $ref: '#/components/schemas/metering_grid_area_system_operator'
          example:
            - business_id: "2219491247539"
              valid_from: "2024-01-01T00:00:00+01:00"
        price_area:
          type: array
          items:
            $ref: '#/components/schemas/metering_grid_area_price_area'
          example:
            - price_area: "NO2"
              valid_from: "2024-01-01T00:00:00+01:00"

    substation:
      type: object
      required:
        - mrid
        - name
        - kind
        - primary_concessionaire
        - substation_cluster_mrid
        - voltage_levels
        - latitude
        - longitude
      properties:
        mrid:
          type: string
          format: uuid
          example: "67878d70-9e32-47b6-aa29-53fedfab1358"
        name:
          type: string
          example: "Substation 1"
        kind:
          type: string
          description: Kind of substation, as given by the grid model source.
          example: "distribution"
        primary_concessionaire:
          type: string
          description: >
            Name and organisation number of the primary concessionaire.
          example: "Grid Company AS (123456789)"
        substation_cluster_mrid:
          type: string
          format: uuid
          example: "11111111-9e32-47b6-aa29-53fedfab1358"
        voltage_levels:
          type: array
          description: Nominal voltages of the substation.
          items:
            type: number
            format: double
          example: [22000.0, 400.0]
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 59.9139
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 10.7522

    substation_cluster:
      type: object
      required:
        - mrid
        - name
        - latitude
        - longitude
      properties:
        mrid:
          type: string
          format: uuid
          example: "11111111-9e32-47b6-aa29-53fedfab1358"
        name:
          type: string
          example: "Cluster 1"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 59.9139
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 10.7522

    line:
      type: object
      required:
        - mrid
        - name
        - from_substation_cluster_mrid
        - to_substation_cluster_mrid
      properties:
        mrid:
          type: string
          format: uuid
          example: "22222222-9e32-47b6-aa29-53fedfab1358"
        name:
          type: string
          example: "Line 1"
        from_substation_cluster_mrid:
          type: string
          format: uuid
          example: "11111111-9e32-47b6-aa29-53fedfab1358"
        to_substation_cluster_mrid:
          type: string
          format: uuid
          example: "33333333-9e32-47b6-aa29-53fedfab1358"

    grid_model:
      type: object
      required:
        - substations
        - substation_clusters
        - lines
      properties:
        substations:
          type: array
          items:
            $ref: '#/components/schemas/substation'
        substation_clusters:
          type: array
          items:
            $ref: '#/components/schemas/substation_cluster'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/line'

paths:
  /accounting_point/{gsrn}:
    get:
      summary: Read accounting point data by GSRN
      description: |
        Retrieves accounting point information from the
        datahub for a given GSRN (metering point ID).
      operationId: read_accounting_point
      tags:
        - accounting_point
      parameters:
        - name: gsrn
          in: path
          required: true
          description: Global Service Relation Number (18-digit GSRN)
          schema:
            type: string
            pattern: "^[0-9]{18}$"
          example: "707057500012345678"
        - name: valid_from
          in: query
          required: true
          description: >-
            Filter results to include only data valid from this date/time.
            ISO 8601 format.
          schema:
            type: string
            format: date-time
          example: "2024-01-01T00:00:00+01:00"
        - name: valid_to
          in: query
          required: false
          description: >-
            Filter results to include only data valid up to this date/time.
            ISO 8601 format. Defaults to open end if not provided.
          schema:
            type: string
            format: date-time
          example: "2024-12-31T00:00:00+01:00"
      responses:
        '200':
          description: Accounting point data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accounting_point'
              example:
                gsrn: "707057500012345678"
                end_user:
                  - business_id: "123456789"
                    entity_type: "organisation"
                    valid_from: "2024-01-01T00:00:00+01:00"
                    valid_to: null
                energy_supplier:
                  - business_id: "7080012345678"
                    valid_from: "2024-01-01T00:00:00+01:00"
                    valid_to: "2024-06-01T00:00:00+02:00"
                  - business_id: "7080087654321"
                    valid_from: "2024-06-01T00:00:00+02:00"
                    valid_to: null
                metering_grid_area:
                  - business_id: "10YNO-1--------2"
                    valid_from: "2024-01-01T00:00:00+01:00"
                    valid_to: null
                energy_direction:
                  - direction: ["consumption"]
                    valid_from: "2024-01-01T00:00:00+01:00"
                    valid_to: null
        'default':
          description: Something unexpected
          content:
            text/plain:
              schema:
                type: string

  /metering_grid_area:
    get:
      summary: Read metering grid area data
      description: >-
        Retrieves all metering grid areas as well as their price areas and
        system operators from the external source.
      operationId: read_metering_grid_areas
      tags:
        - grid_areas
      responses:
        '200':
          description: Metering grid area data retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/metering_grid_area'
              example:
                - business_id: "10YNO-1--------2"
                  name: "X AREA 2"
                  is_active: true
                  system_operator:
                    - business_id: "2219491247539"
                      valid_from: "2024-01-01T00:00:00+01:00"
                  price_area:
                    - price_area: "NO2"
                      valid_from: "2024-01-01T00:00:00+01:00"
        'default':
          description: Something unexpected
          content:
            text/plain:
              schema:
                type: string

  /grid_model:
    get:
      summary: Read grid model data
      description: >-
        Retrieves all substations, substation clusters and lines from the
        grid model source (Nemo).
      operationId: read_grid_model
      tags:
        - grid_model
      responses:
        '200':
          description: Grid model data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grid_model'
              example:
                substations:
                  - mrid: "67878d70-9e32-47b6-aa29-53fedfab1358"
                    name: "Substation 1"
                    kind: "distribution"
                    primary_concessionaire: "Grid Company AS (123456789)"
                    substation_cluster_mrid:
                      "11111111-9e32-47b6-aa29-53fedfab1358"
                    voltage_levels: [22000.0, 400.0]
                    latitude: 59.9139
                    longitude: 10.7522
                substation_clusters:
                  - mrid: "11111111-9e32-47b6-aa29-53fedfab1358"
                    name: "Cluster 1"
                    latitude: 59.9139
                    longitude: 10.7522
                lines:
                  - mrid: "22222222-9e32-47b6-aa29-53fedfab1358"
                    name: "Line 1"
                    from_substation_cluster_mrid:
                      "11111111-9e32-47b6-aa29-53fedfab1358"
                    to_substation_cluster_mrid:
                      "33333333-9e32-47b6-aa29-53fedfab1358"
        'default':
          description: Something unexpected
          content:
            text/plain:
              schema:
                type: string

servers:
  - url: http://adapter:8080
    description: Development
