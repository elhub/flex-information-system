ktor:
  application:
    modules:
      - no.elhub.flex.ApplicationKt.module
  deployment:
    port: 8080
  database:
    url: ${FLEX_DATABASE_URL}
    username: ${FLEX_DATABASE_USERNAME}
    password: ${FLEX_DATABASE_PASSWORD}
    driverClass: org.postgresql.Driver
    hikari:
      maximumPoolSize: 10

flex:
  jwtSecret: ${FLEX_JWT_SECRET}
  timezone: ${FLEX_TIMEZONE:Europe/Oslo}

accountingPointAdapter:
  baseUrl: ${ACCOUNTING_POINT_ADAPTER_BASE_URL}
  apiKey: ${ACCOUNTING_POINT_ADAPTER_API_KEY}
  syncEnabled: ${ACCOUNTING_POINT_ADAPTER_SYNC_ENABLED:true}

mail:
  host: ${MAIL_SMTP_HOST:}
  port: ${MAIL_SMTP_PORT:587}
  username: ${MAIL_SMTP_USERNAME:}
  password: ${MAIL_SMTP_PASSWORD:}
  from: ${MAIL_FROM:}
  start-tls: ${MAIL_SMTP_STARTTLS:true}

attachment-storage:
attachmentStorage:
  bucket: ${S3_BUCKET:}
  internalEndpoint: ${S3_INTERNAL_ENDPOINT:}
  publicEndpoint: ${S3_PUBLIC_ENDPOINT:}
  region: ${S3_REGION:}
  accessKey: ${S3_ACCESS_KEY:}
  secretKey: ${S3_SECRET_KEY:}
