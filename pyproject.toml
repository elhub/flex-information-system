[project]
name = "flex-information-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "click",
  "flask",
  "jinja2",
  "markdown-callouts",
  "mkdocs-material",
  "openapi-python-client",
  "ruff",
  "tabulate",
]

[tool.uv]
# Align with renovate
exclude-newer = "3 days"
system-certs = true

[tool.pyright]
venvPath = "."
venv = ".venv"
