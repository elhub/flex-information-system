[tools]
"python" = "3.14.6"
"go" = "1.27.1"
"uv" = "0.12.9"
"golangci-lint" = "2.13.2"
"pandoc" = "3.11"
"ruff" = "0.16.6"
"sqlc" = "1.31.1"
jsonschema = "16.9.0"
spectral = "6.16.2"

"go:github.com/google/go-licenses/v2" = "2.0.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.5.0"
"go:golang.org/x/tools/cmd/stringer" = "0.47.0"
"go:github.com/dmarkham/enumer" = "1.6.3"
"go:github.com/air-verse/air" = "1.67.4"

[settings]
python.uv_venv_auto = "create|source"

[env]
GOEXPERIMENT = 'jsonv2'
REQUESTS_CA_BUNDLE = '/etc/ssl/certs/ca-certificates.crt'
