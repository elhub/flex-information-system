[tools]
"python" = "3.15.0"
"go" = "1.27.2"
"uv" = "0.13.1"
"golangci-lint" = "2.14.0"
"ruff" = "0.17.1"
"pandoc" = "3.12"
"sqlc" = "1.31.1"
"spectral" = "6.17.0"
"jsonschema" = "17.2.0"

"go:github.com/google/go-licenses/v2" = "2.0.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.5.0"
"go:golang.org/x/tools/cmd/stringer" = "0.47.0"
"go:github.com/dmarkham/enumer" = "1.7.2"
"go:github.com/air-verse/air" = "1.67.4"

[settings]
python.uv_venv_auto = "create|source"

[env]
REQUESTS_CA_BUNDLE = '/etc/ssl/certs/ca-certificates.crt'
